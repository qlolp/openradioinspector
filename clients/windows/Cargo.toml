[package]
name = "openradioinspector-windows"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Independent from the repository's candidate core workspace.
[workspace]

[lib]
name = "ori_native_bridge"
path = "src/lib.rs"

[[bin]]
name = "openradioinspector-windows"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
webbrowser = "=1.2.6"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
