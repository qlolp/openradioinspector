name: Required conditional PR checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  actions: read

jobs:
  pr:
    name: PR
    # GitHub requires the named verdicts from the latest run, including metadata edits.
    concurrency:
      group: required-conditional-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/conditional-checks.yml
