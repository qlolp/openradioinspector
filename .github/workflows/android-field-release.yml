name: Publish accepted Android Field universal APK
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful protected Field upload bundle workflow run ID
        type: string
        required: true
      test_run:
        description: Android Field workflow run ID dispatched on main at the same source
        type: string
        required: true
      receipt_b64:
        description: Base64 of sanitized S22 install, upgrade and hardware acceptance JSON
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: android-field-publication
  cancel-in-progress: false

jobs:
  review:
    if: github.ref_protected && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: android-field-review
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      sums: ${{ steps.review.outputs.sums }}
      artifact: ${{ steps.review.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          TEST_RUN: ${{ inputs.test_run }}
        run: python3 -m tools.field.play_distribution origin --build-run "$BUILD_RUN" --test-run "$TEST_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: ${{ steps.origin.outputs.artifact }}
          path: ${{ runner.temp }}/upload
      - name: Select verification tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.FIELD_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.FIELD_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - id: review
        name: Verify Play's original APK, source, certificates, archive continuity and private report hashes
        env:
          GH_TOKEN: ${{ github.token }}
          FIELD_PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
          FIELD_PLAY_CERT_SHA256: ${{ vars.FIELD_PLAY_CERT_SHA256 }}
          FIELD_UPLOAD_CERT_SHA256: ${{ vars.FIELD_UPLOAD_CERT_SHA256 }}
          FIELD_RECEIPT_B64: ${{ inputs.receipt_b64 }}
          FIELD_CANDIDATE_ARTIFACT: ${{ steps.origin.outputs.artifact }}
          BUILD_RUN: ${{ inputs.build_run }}
          TEST_RUN: ${{ inputs.test_run }}
        run: |
          python3 -m tools.field.play_distribution review --build-run "$BUILD_RUN" --test-run "$TEST_RUN" --candidate "$RUNNER_TEMP/upload" --out "$RUNNER_TEMP/field"
          echo "sums=$(sha256sum "$RUNNER_TEMP/field/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "artifact=field-reviewed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.review.outputs.artifact }}
          path: ${{ runner.temp }}/field
          if-no-files-found: error
          retention-days: 60

  publish:
    needs: review
    if: github.ref_protected && github.ref == 'refs/heads/main'
    environment: android-field-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.review.outputs.artifact }}
          path: ${{ runner.temp }}/approved
      - name: Confirm the human approval and the receipt submitted for review
        env:
          GH_TOKEN: ${{ github.token }}
          FIELD_REVIEWED_SUMS: ${{ needs.review.outputs.sums }}
        run: python3 -m tools.field.play_distribution approve --out "$RUNNER_TEMP/approved"
      - id: witness
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/approved/android-field-acceptance.json
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.FIELD_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.FIELD_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - id: publisher
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read
          permission-administration: read
      - name: Check public Play rollout and publish the reviewed bytes under their own tag
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token || secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          ORI_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
          FIELD_PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
          FIELD_PLAY_CERT_SHA256: ${{ vars.FIELD_PLAY_CERT_SHA256 }}
          FIELD_UPLOAD_CERT_SHA256: ${{ vars.FIELD_UPLOAD_CERT_SHA256 }}
          FIELD_REVIEWED_SUMS: ${{ needs.review.outputs.sums }}
          FIELD_ACCEPTANCE_BUNDLE: ${{ steps.witness.outputs.bundle-path }}
        run: python3 -m tools.field.play_distribution publish --out "$RUNNER_TEMP/approved" --proof "$FIELD_ACCEPTANCE_BUNDLE"
