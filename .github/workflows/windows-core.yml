name: Cross-platform synthetic release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-release:
    name: synthetic-${{ matrix.os }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14', '3.15']
    runs-on: ${{ matrix.os == 'macos-latest' && matrix.python == '3.12' && 'xcode-27' || matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Select Xcode 27.2 and Swift 6.4.2
        if: runner.os == 'macOS' && matrix.python == '3.12'
        shell: bash
        run: bash macos/ci/select-xcode.sh
      - name: Install core with COM dependency
        run: |
          python -m pip install --require-hashes -r requirements/core.lock
          python -m pip install --no-deps '.[serial,test]'
      - name: Check Windows audio cancellation before the full suite
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_windows_audio_stream.AudioCancellationTests
      - name: Check selected Python and headless Tk display on Linux
        if: runner.os == 'Linux'
        run: python -m tools.ci.headless_bootstrap
      - name: Run Linux release checks with hidden Tk
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.run_release_checks --report-dir release-reports
      - name: Run Windows release checks with hidden Tk
        if: runner.os == 'Windows'
        run: python -m tests.run_release_checks --report-dir release-reports
      - name: Run macOS Python release checks
        if: runner.os == 'macOS' && matrix.python != '3.12'
        run: python -m tests.run_release_checks --report-dir release-reports
      - name: Run macOS release checks, both Swift suites and unsigned Xcode build
        if: runner.os == 'macOS' && matrix.python == '3.12'
        run: python macos/ci/native_ci.py -- python -m tests.run_release_checks --swift --report-dir release-reports
      - name: Capture modernization source baseline
        run: python -m tests.modernization_baseline --report-dir release-reports/baseline --sweeps 128 --bins 290
      # Only owned synthetic servers/archives, mocked COM and own PTYs are used.
      # Real receiver/analyzer acceptance remains separate and is not implied.
      # Windows permits explicit POSIX PTY, permission-bit and shell-launcher skips.
      - name: Record CI status before artifact upload
        if: always()
        shell: bash
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p release-reports
          printf 'job_status=%.16s\nhead_sha=%.40s\n' "$CI_JOB_STATUS" "$CI_HEAD_SHA" > release-reports/ci-status.log
      - name: Preserve synthetic release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics-${{ matrix.os }}-py${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: release-reports/
          if-no-files-found: error
          retention-days: 14
