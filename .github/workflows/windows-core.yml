name: Cross-platform synthetic release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-release:
    name: synthetic-${{ matrix.os }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install core with COM dependency
        run: python -m pip install '.[serial,test]'
      - name: Install headless Tk display on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Run Linux release checks with hidden Tk
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.run_release_checks
      - name: Run Windows release checks with hidden Tk
        if: runner.os == 'Windows'
        run: python -m tests.run_release_checks
      - name: Run macOS Python release checks
        if: runner.os == 'macOS' && matrix.python != '3.12'
        run: python -m tests.run_release_checks
      - name: Run macOS release checks, both Swift suites and unsigned Xcode build
        if: runner.os == 'macOS' && matrix.python == '3.12'
        run: python -m tests.run_release_checks --swift
      # Only owned synthetic servers/archives, mocked COM and own PTYs are used.
      # Real receiver/analyzer acceptance remains separate and is not implied.
      # Windows permits only the existing POSIX PTY and permission-bit skips.
