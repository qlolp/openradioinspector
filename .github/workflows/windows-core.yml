name: Windows core and clients

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install core with COM dependency
        run: python -m pip install '.[serial]'
      - name: Run synthetic Python, WebUI and hidden Tk tests
        env:
          ORI_WINDOWS_RELEASE_TK: '1'
        run: python -m unittest discover -s tests -t . -v
      # These runners have no receiver or analyzer; native COM hardware validation
      # remains a separate acceptance step. POSIX PTY tests skip on Windows.
