name: Build candidate packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install build '.[serial]'
      - run: python tools/release/check_public_tree.py
      - run: python -m build
      - run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            python tools/release/check_public_tree.py --artifact "$artifact"
          done
      - run: python tools/release/verify_sdist.py dist/*.tar.gz
      - name: Check presentation contract from extracted sdist
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ori-sdist-presentation"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/ori-sdist-presentation"
          cd "$RUNNER_TEMP"/ori-sdist-presentation/*
          python -m unittest tests.test_windows_spectrum_view.SpectrumViewTests
          node tests/webui_spectrum_view.cjs
      - run: python tools/release/package_evidence.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-python-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
      - name: Install wheel outside checkout
        run: |
          wheel=$(realpath dist/*.whl)
          python -m venv "$RUNNER_TEMP/ori-wheel"
          "$RUNNER_TEMP/ori-wheel/bin/pip" install "$wheel[serial]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ori-wheel/bin/radioinspector-desktop" --self-check --data-dir "$RUNNER_TEMP/ori-data"
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Select Xcode 27.2 and Swift 6.4.2
        if: runner.os == 'macOS'
        shell: bash
        run: bash macos/ci/select-xcode.sh
      - name: Build Windows unsigned installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/build.ps1
      - name: Check bundled Windows files and owned-core startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/release/check_public_tree.py --directory build/windows/dist/OpenRadioInspector
          $app = (Resolve-Path build/windows/dist/OpenRadioInspector/OpenRadioInspector.exe).Path
          $child = Start-Process $app -ArgumentList '--self-check', '--data-dir', "$env:RUNNER_TEMP/ori-frozen-smoke" -Wait -PassThru
          if ($child.ExitCode -ne 0) { throw 'Frozen app self-check failed' }
          $installers = @(Get-ChildItem build/windows/packages/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          packaging/windows/smoke-install.ps1 -Installer $installers[0].FullName
          python tools/release/package_evidence.py build/windows/packages
      - name: Build macOS unsigned app and DMG
        if: runner.os == 'macOS'
        run: bash packaging/macos/build.sh
      - name: Check bundled macOS files
        if: runner.os == 'macOS'
        run: |
          python tools/release/check_public_tree.py --directory build/macos/OpenRadioInspector.app
          python tools/release/smoke_owned_core.py build/macos/OpenRadioInspector.app/Contents/Helpers/openradioinspector-core/openradioinspector-core
          python tools/release/package_evidence.py build/macos/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.os == 'Windows' && 'build/windows/packages/*' || 'build/macos/packages/*' }}
          retention-days: 7
          if-no-files-found: error
  native-review-regressions:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[serial,test]'
      - name: Select Xcode 27.2 and Swift 6.4.2
        shell: bash
        run: bash macos/ci/select-xcode.sh
      - name: Check bundled helper and remote launch lifetimes
        run: |
          python macos/ci/test_launcher.py -v
          python macos/ci/test_native_ci.py -v
      - name: Native URL and concurrent completion regressions
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path macos/SpektrKomandy -j 2 --filter '(testIPv6LoopbackKeepsHTTPExceptionNarrow|testResponseDelegateCompletesCancellationAcrossExecutorsOnce|testResponseDelegateRetainsCancellationUntilCallbackInstallation|testSupportedSweepHistoryFitsResponseBudget|SecurityClientTests)'
      - name: Native credentials, pairing and archive context regressions
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path macos -j 2 --filter '(NativeNodeConnectionTests|NativeCredentialStoreTests|NativeArchiveContextTests|NativeStreamingModelTests|SweepComparisonModelTests)' --skip DvoynoyObzorSessionTests.SessionTests/testPhysicalTinySAUltraSmokeIfConnected
      - name: Compile native app in Swift 6 mode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project macos/DvoynoyObzor.xcodeproj -scheme DvoynoyObzor -configuration Debug -jobs 2 -destination platform=macOS -derivedDataPath "$RUNNER_TEMP/native-swift6" CODE_SIGNING_ALLOWED=NO build
