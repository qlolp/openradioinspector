name: Conditional client and reference checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Compare PR files
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.compare.outputs.clients }}
      reference: ${{ steps.compare.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: compare
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/pr_checks.py paths "$BASE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  clients:
    name: Test modern clients
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/modern-clients.yml

  reference:
    name: Test native reference load
    needs: changes
    if: needs.changes.outputs.reference == 'true'
    uses: ./.github/workflows/windows-load.yml
    with:
      full: ${{ contains(github.event.pull_request.labels.*.name, 'full-reference-load') }}

  verdict:
    name: ${{ matrix.context }}
    if: always()
    needs: [changes, clients, reference]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: clients
            context: Modern clients
          - suite: reference
            context: Native reference load
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Verify required jobs
        env:
          SUITE: ${{ matrix.suite }}
          COMPARISON: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs[matrix.suite] }}
          RESULT: ${{ needs[matrix.suite].result }}
          EVIDENCE: ${{ toJSON(needs[matrix.suite].outputs) }}
        run: python3 tools/ci/pr_checks.py verify "$SUITE" "$COMPARISON" "$SELECTED" "$RESULT" "$EVIDENCE"
