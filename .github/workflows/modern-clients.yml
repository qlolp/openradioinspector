name: Modern Web and Windows clients
on:
  push:
    branches: [main, 'codex/**']
    paths: ['clients/web/**', 'clients/windows/**', '.github/workflows/modern-clients.yml', 'radioinspector/**', 'contracts/**', 'crates/ori-stream/**', 'crates/ori-contracts/**']
  pull_request:
    paths: ['clients/web/**', 'clients/windows/**', '.github/workflows/modern-clients.yml', 'radioinspector/**', 'contracts/**', 'crates/ori-stream/**', 'crates/ori-contracts/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: clients/web
      - run: npx playwright install --with-deps chromium
        working-directory: clients/web
      - run: npm run format:check && npm test && npm run build
        working-directory: clients/web
      - name: Real-core browser workflows
        run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") npm run test:e2e
        working-directory: clients/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: modern-web-evidence
          path: |
            clients/web/dist
            clients/web/test-results

  native-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, exact compiler below
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (GitHub API verified)
        with:
          workspaces: clients/windows
      - run: cargo fmt --manifest-path clients/windows/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path clients/windows/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path clients/windows/Cargo.toml --locked -- --test-threads=2

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            clients/windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, exact compiler below
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (GitHub API verified)
        with:
          workspaces: clients/windows
      - run: npm ci --prefix clients/web
      - run: npm ci --prefix clients/windows
      - run: npm --prefix clients/web run build:native
      - run: cargo test --manifest-path clients/windows/Cargo.toml --locked -- --test-threads=2
      - name: Build per-user offline WebView2 installer
        run: npm run build -- --ci -- --locked
        working-directory: clients/windows
      - name: Install and launch packaged Windows client
        shell: pwsh
        run: |
          $installer = Get-ChildItem clients/windows/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $binary = Join-Path $env:LOCALAPPDATA 'OpenRadioInspector/openradioinspector-windows.exe'
          if (-not (Test-Path $binary)) { throw 'Installed client missing' }
          $client = Start-Process -FilePath $binary -PassThru
          Start-Sleep -Seconds 8
          if ($client.HasExited) { throw "Packaged client exited $($client.ExitCode)" }
          Stop-Process -Id $client.Id
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-offline-installer
          path: clients/windows/target/release/bundle/nsis/*.exe
