name: Modern Web and Windows clients
on:
  push:
    branches: [main, 'codex/**']
    paths: ['clients/web/**', 'clients/windows/**', '.github/workflows/modern-clients.yml', 'radioinspector/**', 'contracts/**', 'crates/**', 'Cargo.lock', 'deploy/windows/**', 'tools/release/prepare_windows_node.py', 'tools/release/native_notices.py']
  pull_request:
    paths: ['clients/web/**', 'clients/windows/**', '.github/workflows/modern-clients.yml', 'radioinspector/**', 'contracts/**', 'crates/**', 'Cargo.lock', 'deploy/windows/**', 'tools/release/prepare_windows_node.py', 'tools/release/native_notices.py']
  workflow_dispatch:
    inputs:
      prior_run_id:
        description: 'Windows workflow run containing the compatible prior NSIS installer'
        type: string
      prior_installer_sha256:
        description: 'Pinned SHA-256 of that exact prior installer'
        type: string
      prior_revision:
        description: 'Pinned source revision of the prior installed helpers'
        type: string

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: clients/web
      - run: npx playwright install --with-deps chromium
        working-directory: clients/web
      - run: npm run format:check && npm test && npm run build
        working-directory: clients/web
      - name: Real-core browser workflows
        run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") npm run test:e2e
        working-directory: clients/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: modern-web-evidence
          path: |
            clients/web/dist
            clients/web/test-results

  native-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, exact compiler below
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (GitHub API verified)
        with:
          workspaces: clients/windows
      - run: cargo fmt --manifest-path clients/windows/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path clients/windows/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path clients/windows/Cargo.toml --locked -- --test-threads=2

  windows-installer:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            clients/windows/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.1.0
        with:
          python-version: '3.15.1'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, exact compiler below
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (GitHub API verified)
        with:
          workspaces: clients/windows
      - run: npm ci --prefix clients/web
      - run: npm ci --prefix clients/windows
      - name: Check Windows Job and private named pipe
        id: native_ownership
        run: cargo test -p ori-runtime --locked --lib -- --test-threads=2
      - name: Build per-user offline WebView2 installer with serial core
        id: package
        run: npm run build -- --ci -- --locked
        working-directory: clients/windows
      - name: Hash the produced candidate before acceptance
        id: checksum
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem clients/windows/target/release/bundle/nsis/*.exe)
          if ($packages.Count -ne 1) { throw 'Expected one x64 NSIS installer' }
          $hash = (Get-FileHash -Algorithm SHA256 $packages[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($packages[0].Name)" | Set-Content -Encoding ascii "$($packages[0].FullName).sha256"
      - id: bridge
        run: cargo test --manifest-path clients/windows/Cargo.toml --locked -- --test-threads=2
      - name: Fetch the pinned previous Windows candidate
        id: prior
        if: github.event_name == 'workflow_dispatch' && inputs.prior_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prior_run_id }}
          pattern: windows-x64-offline-rc*
          merge-multiple: true
          path: ${{ runner.temp }}/ori-prior-installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.checksum.outcome == 'success' && !cancelled()
        with:
          name: windows-x64-offline-rc-candidate
          path: |
            clients/windows/target/release/bundle/nsis/*.exe
            clients/windows/target/release/bundle/nsis/*.sha256
            clients/windows/runtime/rc-build-info.json
      - name: Exercise installed local node and UI
        id: installed
        if: >-
          !cancelled() && steps.checksum.outcome == 'success' && steps.bridge.outcome == 'success' &&
          (steps.prior.outcome == 'success' || steps.prior.outcome == 'skipped')
        shell: pwsh
        env:
          ORI_PRIOR_RUN: ${{ inputs.prior_run_id }}
          ORI_PRIOR_SHA256: ${{ inputs.prior_installer_sha256 }}
          ORI_PRIOR_REVISION: ${{ inputs.prior_revision }}
        run: |
          $packages = @(Get-ChildItem clients/windows/target/release/bundle/nsis/*.exe)
          if ($packages.Count -ne 1) { throw 'Expected one x64 NSIS installer' }
          $report = Join-Path $env:RUNNER_TEMP 'ori-windows-diagnostics/installation.json'
          $check = @{Installer=$packages[0].FullName; ExpectedRevision=(git rev-parse HEAD); ReportPath=$report}
          if ($env:ORI_PRIOR_RUN -or $env:ORI_PRIOR_SHA256 -or $env:ORI_PRIOR_REVISION) {
            if ($env:ORI_PRIOR_RUN -notmatch '^[0-9]+$') { throw 'Prior workflow run ID missing' }
            $previous = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ori-prior-installer') -Recurse -File -Filter *.exe)
            if ($previous.Count -ne 1) { throw 'Expected exactly one prior NSIS installer' }
            $check.PriorInstaller = $previous[0].FullName
            $check.PriorInstallerSha256 = $env:ORI_PRIOR_SHA256
            $check.PriorRevision = $env:ORI_PRIOR_REVISION
          }
          ./deploy/windows/smoke-installed.ps1 @check
      - name: Record Windows build and install outcomes
        if: always()
        shell: pwsh
        env:
          ORI_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ORI_OWNERSHIP_RESULT: ${{ steps.native_ownership.outcome }}
          ORI_BUILD_RESULT: ${{ steps.package.outcome }}
          ORI_HASH_RESULT: ${{ steps.checksum.outcome }}
          ORI_BRIDGE_RESULT: ${{ steps.bridge.outcome }}
          ORI_INSTALL_RESULT: ${{ steps.installed.outcome }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ori-windows-diagnostics'
          $null = [IO.Directory]::CreateDirectory($dir)
          $packages = @(Get-ChildItem clients/windows/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue)
          $inventory = @(foreach ($file in $packages) {
            @{bytes=$file.Length; sha256=(Get-FileHash $file.FullName).Hash.ToLowerInvariant()}
          })
          $smokeFile = Join-Path $dir 'installation.json'
          if (-not (Test-Path -LiteralPath $smokeFile)) {
            $phase = if ($packages.Count -eq 0) { 'installer_missing' } elseif ($packages.Count -gt 1) { 'installer_ambiguous' } else { 'acceptance_not_started' }
            $fallback = @{schema_version=1; result='not_run'; phase=$phase; reached=@(); package_rollback='not_run'; installer_exit_code=$null}
            [IO.File]::WriteAllText($smokeFile, ($fallback | ConvertTo-Json))
          }
          $smoke = Get-Content -Raw $smokeFile | ConvertFrom-Json
          $packageGate = if ($smoke.result -eq 'passed' -and $smoke.package_rollback -eq 'passed') { 'passed' }
            elseif ($smoke.result -eq 'failed') { 'failed' } else { 'pending' }
          $result = [ordered]@{
            schema_version=1; revision=$env:ORI_EXPECTED_REVISION; windows_build=[Environment]::OSVersion.Version.Build
            ownership=$env:ORI_OWNERSHIP_RESULT; build=$env:ORI_BUILD_RESULT; bridge=$env:ORI_BRIDGE_RESULT
            installed=$env:ORI_INSTALL_RESULT; installer_count=$packages.Count; installers=$inventory
            checksum=$env:ORI_HASH_RESULT; artifact_class='unaccepted_candidate'; package_gate=$packageGate
            package_rollback=$smoke.package_rollback
          }
          [IO.File]::WriteAllText((Join-Path $dir 'build.json'), ($result | ConvertTo-Json -Depth 4))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-x64-rc-diagnostics
          path: ${{ runner.temp }}/ori-windows-diagnostics/*.json
          if-no-files-found: error
