[package]
name = "ori-android-field"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Receive-only field capture over Android USB Host serial bridges"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ori-instruments = { path = "../ori-instruments" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "rt", "net", "time"] }

[target.'cfg(unix)'.dependencies]
jni = "=0.22.4"
libc = "=0.2.191"
