[package]
name = "ori-legacy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
ori-contracts = { path = "../ori-contracts" }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup", "hooks", "limits"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "arbitrary_precision", "raw_value"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "=1.29.2", features = ["v4"] }

[dev-dependencies]
sha2 = "=0.11.1"
