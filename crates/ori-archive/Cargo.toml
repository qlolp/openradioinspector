[package]
name = "ori-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "functions", "backup", "hooks", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "arbitrary_precision", "raw_value"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
strip = true
lto = "thin"
