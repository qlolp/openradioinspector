[package]
name = "ori-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"
description = "Explicit shadow, replay and live candidate for the shared OpenRadioInspector core"

[features]
default = []
serial = ["ori-instruments/serial"]
audio = ["ori-audio/native"]

[dependencies]
ori-archive = { path = "../ori-archive" }
ori-contracts = { path = "../ori-contracts" }
ori-instruments = { path = "../ori-instruments" }
ori-runtime = { path = "../ori-runtime" }
ori-session = { path = "../ori-session" }
ori-guard = { path = "../ori-guard" }
ori-stream = { path = "../ori-stream" }
ori-tasks = { path = "../ori-tasks" }
ori-audio = { path = "../ori-audio" }
ori-legacy = { path = "../ori-legacy" }
ori-history = { path = "../ori-history" }
ori-control = { path = "../ori-control" }
ori-automation = { path = "../ori-automation" }
unicode-general-category = "=0.6.0"
axum-server = { version = "=0.9.2", features = ["tls-rustls-no-provider"] }
httparse = "=1.10.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time", "io-util", "io-std"] }
chrono = { version = "=0.4.45", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "arbitrary_precision"] }
thiserror = "=2.0.21"
rand = "=0.8.8"
async-stream = "=0.3.6"
futures-util = "=0.3.34"
percent-encoding = "=2.3.2"
url = "=2.5.8"
subtle = "=2.6.1"
base64 = "=0.23.1"
sha2 = "=0.11.1"
hmac = "=0.13.0"
fs2 = "=0.4.3"
tempfile = "=3.27.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }

[[bin]]
name = "ori-core"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
