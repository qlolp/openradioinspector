[package]
name = "ori-history"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Owned snapshot research jobs and bounded native history projections"

[dependencies]
ori-archive = { path = "../ori-archive" }
ori-contracts = { path = "../ori-contracts" }
ori-runtime = { path = "../ori-runtime" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
fs2 = "=0.4.3"
rand = "=0.8.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
