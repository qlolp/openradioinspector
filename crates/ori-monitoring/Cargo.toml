[package]
name = "ori-monitoring"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Pure Rust parity implementation of the robust-city-v1 sweep detector"

[dependencies]
ori-contracts = { path = "../ori-contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "arbitrary_precision"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
sha2 = "=0.11.1"
