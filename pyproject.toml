[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openradioinspector"
version = "0.2.0"
description = "Открытая реализация RadioInspector для macOS, Windows и Raspberry Pi"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenRadioInspector contributors"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
web = []
windows = []
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
plot = ["matplotlib>=3.5"]
soapy = ["SoapySDR>=0.8"]
rtl = ["pyrtlsdr>=0.1"]
scapy = ["scapy>=2.5"]
all = [
    "matplotlib>=3.5",
    "SoapySDR>=0.8",
    "pyrtlsdr>=0.1",
    "scapy>=2.5",
]

[project.scripts]
radioinspector = "radioinspector.cli:main"
radioinspector-windows = "radioinspector.windows.app:main"
radioinspector-archive-import = "radioinspector.archive_ingest:main"
radioinspector-archive-export = "radioinspector.archive_export:main"
radioinspector-archive-stream = "radioinspector.archive_stream:main"
radioinspector-archive-export-stream = "radioinspector.archive_export_stream:main"

[project.urls]
Homepage = "https://github.com/qlolp/openradioinspector"
Documentation = "https://github.com/qlolp/openradioinspector/tree/main/docs"
Issues = "https://github.com/qlolp/openradioinspector/issues"

[tool.setuptools.packages.find]
include = ["radioinspector*"]
